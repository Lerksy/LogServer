<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Router LogServer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <h1>LogServer</h1>
          <p>Router telemetry console</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="manage-link" href="/manage" target="_blank" rel="noopener">Manage alerts ↗</a>
        <div class="connection" id="connection" title="Live stream status">
          <span class="connection-dot"></span>
          <span id="connectionText">Connecting</span>
        </div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="Log controls">
        <label class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 placeholder='Search logs — try severity:error AND topic:firewall'>
          <kbd>/</kbd>
        </label>
        <div class="filter-control severity-filter" id="minimumSeverity" data-value="debug">
          <button class="select-trigger" type="button" aria-haspopup="listbox"
                  aria-expanded="false" aria-controls="severityMenu">
            <span class="select-label">Minimum severity</span>
            <span class="select-row"><span class="select-current">Debug</span><span class="select-chevron" aria-hidden="true">⌄</span></span>
          </button>
          <div class="select-menu" id="severityMenu" role="listbox" aria-label="Minimum severity" hidden>
            <button type="button" role="option" data-value="debug">Debug</button>
            <button type="button" role="option" data-value="info">Info</button>
            <button type="button" role="option" data-value="notice">Notice</button>
            <button type="button" role="option" data-value="warning">Warning</button>
            <button type="button" role="option" data-value="error">Error</button>
            <button type="button" role="option" data-value="critical">Critical</button>
            <button type="button" role="option" data-value="alert">Alert</button>
            <button type="button" role="option" data-value="emergency">Emergency</button>
          </div>
        </div>
        <div class="filter-control page-size-filter" id="pageSize" data-value="100">
          <button class="select-trigger" type="button" aria-haspopup="listbox"
                  aria-expanded="false" aria-controls="pageSizeMenu">
            <span class="select-label">Logs shown</span>
            <span class="select-row"><span class="select-current">100</span><span class="select-chevron" aria-hidden="true">⌄</span></span>
          </button>
          <div class="select-menu" id="pageSizeMenu" role="listbox" aria-label="Logs shown per page" hidden>
            <button type="button" role="option" data-value="50">50</button>
            <button type="button" role="option" data-value="100">100</button>
            <button type="button" role="option" data-value="250">250</button>
            <button type="button" role="option" data-value="500">500</button>
          </div>
        </div>
        <button id="pauseButton" class="button" type="button">
          <span class="pause-symbol" aria-hidden="true">Ⅱ</span>
          <span>Pause live</span>
        </button>
      </section>

      <div class="query-help">
        <span>Query:</span>
        <code>field:value</code>
        <code>AND</code>
        <code>OR</code>
        <code>NOT</code>
        <code>(…)</code>
        <span class="query-example">Example: <code>(severity:error OR severity:critical) source:router-1</code></span>
      </div>

      <section class="summary" aria-live="polite">
        <div><strong id="shownCount">0</strong> logs shown</div>
        <div id="newLogs" class="new-logs" hidden></div>
        <div id="errorMessage" class="error-message" hidden></div>
      </section>

      <section class="log-panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="time-column">Time</th>
                <th>Source</th>
                <th>Severity</th>
                <th>Topics</th>
                <th class="message-column">Message</th>
              </tr>
            </thead>
            <tbody id="logRows"></tbody>
          </table>
          <div id="emptyState" class="empty-state" hidden>
            <div class="empty-icon">≋</div>
            <h2>No logs found</h2>
            <p>Waiting for the first event, or try changing your search.</p>
          </div>
        </div>
        <button id="loadMore" class="load-more" type="button" hidden>Load older logs</button>
      </section>
    </main>

    <template id="rowTemplate">
      <tr class="log-row">
        <td class="log-time"></td>
        <td><span class="source-value"></span></td>
        <td><button class="severity-pill" type="button"></button></td>
        <td class="topics-cell"><div class="topics-list"></div></td>
        <td class="message-cell">
          <div class="message-value"></div>
          <details class="details" hidden>
            <summary>Details</summary>
            <pre></pre>
          </details>
        </td>
      </tr>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
