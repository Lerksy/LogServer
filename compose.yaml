services:
  logserver:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "5514:5514/udp"
    volumes:
      - log-data:/data
    environment:
      # Export this variable before starting Compose when HTTP writes need protection.
      LOGSERVER_INGEST_TOKEN: "${LOGSERVER_INGEST_TOKEN:-}"
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  log-data:
    name: logserver_log-data
    external: true
