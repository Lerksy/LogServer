services:
  logserver:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "5514:5514/udp"
    volumes:
      - log-data:/data
    environment:
      # Set this before exposing HTTP ingestion outside a trusted network.
      LOGSERVER_INGEST_TOKEN: "change-me"

volumes:
  log-data:

