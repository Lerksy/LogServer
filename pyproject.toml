[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrotik-logserver"
version = "0.1.0"
description = "A small HTTP/syslog log server with SQLite storage and a live web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
logserver = "logserver.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["logserver*"]

[tool.setuptools.package-data]
logserver = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

